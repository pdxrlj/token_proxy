name: Rust Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: '是否创建 Release 并上传 exe（true/false）'
        required: false
        default: 'false'
      release_tag:
        description: 'Release 的 tag 名称（留空则自动使用 v<run_number>）'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install frontend deps
        if: ${{ hashFiles('package-lock.json') != '' || hashFiles('package.json') != '' }}
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci
          fi

      - name: Build frontend (if applicable)
        if: ${{ hashFiles('package.json') != '' || hashFiles('**/package.json') != '' }}
        shell: bash
        run: |
          echo "跳过前端构建（如需启用，请取消注释并改为你的 build 命令）"
          # npm run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and src-tauri/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release (cargo)
        working-directory: src-tauri
        shell: bash
        run: cargo build --release --locked

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: token_proxy-windows-exe
          path: src-tauri/target/release/*.exe
          if-no-files-found: error

      - name: Compute release tag
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' }}
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${{ github.run_number }}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload exe (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.value }}
          name: Release ${{ steps.tag.outputs.value }}
          files: src-tauri/target/release/*.exe
