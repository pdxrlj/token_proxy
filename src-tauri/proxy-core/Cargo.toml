[package]
name = "token-proxy-core"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible LLM proxy core: routing, retry, circuit breaker, SSE streaming"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
futures-util = "0.3"
backon = "0.4"
tracing = "0.1"
directories = "6"
notify = "7"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
async-stream = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
