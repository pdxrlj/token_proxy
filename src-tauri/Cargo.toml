[package]
name = "token-proxy"
version = "0.1.0"
description = "Local OpenAI-compatible LLM proxy with retry, routing and a Tauri desktop shell"
authors = ["token-proxy"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "token_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 保存文件对话框：让用户自己选择配置导出到哪里
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "7"
token-proxy-core = { path = "proxy-core" }
# 枚举本机网卡：总览页展示局域网访问地址
local-ip-address = "0.6"
# 一键接入 Codex：保格式改写 ~/.codex/config.toml（保留用户注释与其它配置）
toml_edit = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
