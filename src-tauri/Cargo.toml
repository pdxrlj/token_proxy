[package]
name = "token-proxy"
version = "0.1.0"
description = "Local OpenAI-compatible LLM proxy with retry, routing and a Tauri desktop shell"
authors = ["token-proxy"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "token_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "7"
token-proxy-core = { path = "proxy-core" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
